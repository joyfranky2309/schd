name: CI

on:
  push:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --build-arg WITH_QUANTLIB=OFF --build-arg WITH_SQLITE=OFF -t schd .
      - name: Validate ETL example
        run: docker run --rm -v "$PWD/examples:/jobs:ro" schd validate /jobs/etl.json
      - name: Run ETL example
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD/examples:/jobs:ro" schd run /jobs/etl.json
          status=$?
          if [ "$status" -ne 1 ]; then
            echo "Expected failing branch exit code 1, got $status" >&2
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark
        run: ./build/schd_bench

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build-sqlite -DCMAKE_BUILD_TYPE=Release -DSCHD_WITH_SQLITE=ON
      - name: Build
        run: cmake --build build-sqlite --parallel
      - name: Test
        run: ctest --test-dir build-sqlite --output-on-failure

  quantlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QuantLib
        run: |
          sudo apt-get update
          sudo apt-get install -y libquantlib0-dev
      - name: Configure
        run: cmake -S . -B build-quantlib -DCMAKE_BUILD_TYPE=Release -DSCHD_WITH_QUANTLIB=ON
      - name: Build
        run: cmake --build build-quantlib --parallel
      - name: Test
        run: ctest --test-dir build-quantlib --output-on-failure

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Release -DSCHD_TSAN=ON
      - name: Build
        run: cmake --build build-tsan --parallel
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure --repeat until-fail:20

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Release -DSCHD_ASAN=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
